seed: 0
resize: 256
image_size: 224
num_workers: 4
risk_batch_size: 8
classifier_batch_size: 32

patchcore_backbone: wideresnet50
patchcore_layers: [layer2, layer3]
pretrain_embed_dimension: 1024
target_embed_dimension: 1024
patch_size: 3
coreset_ratio: 0.1
faiss_on_gpu: false

alpha: 0.01
target_recall: 0.95
beta: 0.5
defect_quantile: 0.05
safety_margin: 0.05

initial_epochs: 50
continual_epochs: 20
early_stopping_patience: 5
initial_learning_rate: 0.001
continual_learning_rate: 0.0001
weight_decay: 0.0001
focal_gamma: 2.0
kd_temperature: 2.0
kd_weight: 0.5

device: cuda
pretrained: true
use_coordinate_attention: true
use_pecl: true
use_kd: true
